[project]
name = "snipmd"
version = "0.1.0"
description = "Hotkey, drag a box, get Markdown, LaTeX or a table on your clipboard. Offline OCR for macOS with GLM-OCR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.11"
keywords = ["ocr", "latex", "markdown", "macos", "menubar", "mlx", "glm-ocr", "mathpix", "screenshot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
]
dependencies = [
    "pillow==12.3.0",
    "rumps==0.4.0; sys_platform == 'darwin'",
    "pynput==1.8.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
    "mlx-vlm==0.7.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/snipmd"
Issues = "https://github.com/Arthur031221/snipmd/issues"
Changelog = "https://github.com/Arthur031221/snipmd/blob/main/CHANGELOG.md"

[project.scripts]
snipmd = "snipmd.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
bench = [
    "matplotlib==3.11.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snipmd"]

[tool.hatch.build.targets.sdist]
include = ["src/snipmd", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
